name: Build from embedded patch

# Paste-only build workflow. The reading-progress patch is embedded below as
# gzip+base64, so nothing has to be uploaded and no file name has to survive
# Windows.
#
# Why embedded: this repo cannot be cloned on Windows at all (242 asset names
# contain '|'), and uploading the .patch through the web UI mangled it twice
# with "bad git-diff - inconsistent old filename". Pasting ASCII text avoids
# both failure modes.
#
# Integrity is checked in the job: the decoded patch must be exactly 44237
# bytes with sha256 22b2cd1c95e36033..., otherwise the job stops before compiling.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Decode patch, build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Decode, verify and apply embedded patch
