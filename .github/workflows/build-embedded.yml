          B64EOF
          tr -d '\r\n \t' < /tmp/patch.b64 | base64 -d > /tmp/p.patch.gz
          gunzip -c /tmp/p.patch.gz > LumaGA-reading-progress.patch

          echo "=== 解出的补丁 ==="
          ls -l LumaGA-reading-progress.patch
          echo "行数: $(wc -l < LumaGA-reading-progress.patch)"
          SIZE=$(stat -c%s LumaGA-reading-progress.patch)
          SHA=$(sha256sum LumaGA-reading-progress.patch | cut -d' ' -f1)
          echo "大小  : $SIZE   (期望 33359)"
          echo "sha256: $SHA"
          echo "期望  : 9657a4375c46b3fbdef894ddb01bfd6f6101d5ac3b22358cd57a91a0172c2992"

          if [ "$SIZE" != "33359" ]; then
            echo "::error title=补丁大小不符::解出 $SIZE 字节，期望 33359。内容在传递中被破坏。"
            exit 1
          fi
          if [ "$SHA" != "9657a4375c46b3fbdef894ddb01bfd6f6101d5ac3b22358cd57a91a0172c2992" ]; then
            echo "::error title=补丁校验和不符::内容在传递中被破坏。"
            exit 1
          fi
          echo "校验通过"

          echo "=== 干跑检查 ==="
          git apply --check --verbose LumaGA-reading-progress.patch

          echo "=== 应用 ==="
          git apply --verbose LumaGA-reading-progress.patch

          echo "=== 改动清单（--untracked-files=all：不折叠新目录）==="
          git status --short --untracked-files=all | tee /tmp/status.txt

          # A porcelain file line starts with '??' or with a status column + space.
          # Counting with a single pass avoids grep -c also counting blank/echo lines.
          # The patch file itself is excluded: the decode step overwrites it in place,
          # and counting it is what made an earlier revision fail on a good patch.
          NEW=$(grep -c '^?? ' /tmp/status.txt || true)
          MOD_SRC=$(grep -v 'LumaGA-reading-progress\.patch' /tmp/status.txt \
            | grep -cE '^ [MADRC] ' || true)
          MOD_SELF=$(grep -c 'LumaGA-reading-progress\.patch' /tmp/status.txt || true)
          echo "新文件    : $NEW       (期望 3)"
          echo "源文件修改: $MOD_SRC   (期望 7)"
          echo "（另有 $MOD_SELF 行是补丁文件自身，由解码步骤改写，不计入）"

          if [ "$NEW" != "3" ] || [ "$MOD_SRC" != "7" ]; then
            echo "::error title=改动数量不符::预期 3 新 + 7 改，实际 $NEW 新 + $MOD_SRC 改"
            cat /tmp/status.txt
            exit 1
          fi

          echo "=== 落地内容抽查 ==="
          echo -n "recordLocalReadingProgress: "
          grep -c "fun recordLocalReadingProgress" app/src/main/java/com/bugenzhao/mnga/ui/screens/topicdetails/TopicDetailsScreen.kt || true
          echo -n "topicPageOfFloor: "
          grep -c "fun topicPageOfFloor" app/src/main/java/com/bugenzhao/mnga/storage/TopicReadingProgressStorage.kt || true
          echo -n "中文资源: "
          grep -c "resume_position_title" app/src/main/res/values-zh-rCN/strings.xml || true
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
