name: Build from patch

# Builds an APK by applying LumaGA-reading-progress.patch from the repo root.
#
# Use this when you cannot run git locally: drop the .patch file in the repo
# root and run this workflow from the Actions tab. The patch is applied in the
# runner only and never committed, so a clean clone stays clean.
#
# If the patch is already committed to the branch (the local-git route), skip
# this workflow and use the normal build instead.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["LumaGA-reading-progress.patch"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apply patch and build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image may not carry platform 36 or matching build-tools;
      # pre-accepting the licenses lets AGP fetch the missing pieces itself.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Apply patch
        run: |
          PATCH="LumaGA-reading-progress.patch"
          if [ ! -f "$PATCH" ]; then
            echo "::error title=缺少补丁文件::$PATCH 不在仓库根目录。请把补丁文件上传到仓库根目录后重新运行。"
            exit 1
          fi
          git apply --check --verbose "$PATCH"
          git apply --verbose "$PATCH"
          echo "补丁应用成功，改动如下："
          git status --short

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
